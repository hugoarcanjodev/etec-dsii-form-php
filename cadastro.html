<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Profissional</title>
    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<body class="w3-light-grey">

    <div class="w3-container w3-margin-top" style="max-width:600px; margin:auto;">
        <div class="w3-card-4 w3-white w3-padding-32 w3-round-large">
            
            <h2 class="w3-center w3-text-teal">Formulário de Cadastro</h2>
            
            <form action="processaCadastro.php" method="POST" class="w3-container">
                
                <label class="w3-text-dark-grey"><b>Nome Completo:</b></label>
                <input class="w3-input w3-border w3-round w3-margin-bottom" type="text" name="nome_completo_1" required>

                <label class="w3-text-dark-grey"><b>Idade:</b></label>
                <input class="w3-input w3-border w3-round w3-margin-bottom" type="number" name="idade_2" required>

                <label class="w3-text-dark-grey"><b>Profissão:</b></label>
                <input class="w3-input w3-border w3-round w3-margin-bottom" type="text" name="profissao_3" required>

                <label class="w3-text-dark-grey"><b>Salário Pretendido (R$):</b></label>
                <input class="w3-input w3-border w3-round w3-margin-bottom" type="number" step="0.01" name="salario_pretendido_4" required>

                <label class="w3-text-dark-grey"><b>Experiência Anterior:</b></label>
                <textarea class="w3-input w3-border w3-round w3-margin-bottom" name="experiencia_anterior_5" rows="4" required></textarea>

                <button type="submit" class="w3-button w3-teal w3-block w3-round w3-section w3-padding">Enviar Cadastro</button>

            </form>
        </div>
    </div>

</body>
</html>
